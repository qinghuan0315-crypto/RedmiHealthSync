
workflows:
  redmihealthsync-unsigned:
    name: RedmiHealthSync Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Check Xcode project
        script: |
          cd "$CM_BUILD_DIR"
          xcodebuild -list -project RedmiHealthSync.xcodeproj

      - name: Build iOS app without signing
        script: |
          cd "$CM_BUILD_DIR"
          xcodebuild \
            -project RedmiHealthSync.xcodeproj \
            -scheme RedmiHealthSync \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          set -e
          APP_DIR="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP_PATH"
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -qry RedmiHealthSync-unsigned.ipa Payload

    artifacts:
      - RedmiHealthSync-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
